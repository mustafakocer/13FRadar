name: Send alert digests

# The email digest (docs/EMAIL_ALERTS.md): new 13F filings from the funds
# on a reader's watchlist, Form 4 trades of watched gurus, and saved insider
# filters — to readers who opted in on the account page. Runs every morning
# after the nightly data builds; the script decides who is due (daily /
# weekly) and moves each reader's marks only after a real send.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Match and print (addresses masked) without sending'
        type: boolean
        default: true
      force:
        description: 'Ignore the weekly cadence'
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # A missing key used to stop the job green, and the digest went unsent
      # for a month without anyone seeing it (2026-09-28 → 10-30). Now the run
      # goes red and names what is missing; a dry run needs no mail keys.
      - name: Check configuration
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SITE: ${{ secrets.SITE_URL }}
          MAIL_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.ALERT_FROM }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          missing=""
          [ -n "$SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$SB_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SITE" ] || missing="$missing SITE_URL"
          if [ "$DRY" != "true" ]; then
            [ -n "$MAIL_KEY" ] || missing="$missing RESEND_API_KEY"
            [ -n "$MAIL_FROM" ] || missing="$missing ALERT_FROM"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not configured:$missing — nothing can be sent. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "configuration ok"
      - name: Send digests
        run: node scripts/send-alerts.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
