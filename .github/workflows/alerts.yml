name: Send alert digests

# The email digest (docs/EMAIL_ALERTS.md): new 13F filings from the funds
# on a reader's watchlist, Form 4 trades of watched gurus, and saved insider
# filters — to readers who opted in on the account page. Runs every morning
# after the nightly data builds; the script decides who is due (daily /
# weekly) and moves each reader's marks only after a real send.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Match and print (addresses masked) without sending'
        type: boolean
        default: true
      force:
        description: 'Ignore the weekly cadence'
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Without the service key there is nobody to read; without the mail key
      # (on a real run) nothing can be sent. Both are configuration states,
      # not failures: the job says which is missing and stops green.
      - name: Check configuration
        id: cfg
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIL_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.ALERT_FROM }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ready=true
          if [ -z "$SERVICE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not configured — skipping the digest."
            ready=false
          elif [ "$DRY" != "true" ] && { [ -z "$MAIL_KEY" ] || [ -z "$MAIL_FROM" ]; }; then
            echo "RESEND_API_KEY / ALERT_FROM not configured — nothing can be sent; skipping (run with dry_run to match only)."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Send digests
        if: steps.cfg.outputs.ready == 'true'
        run: node scripts/send-alerts.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
