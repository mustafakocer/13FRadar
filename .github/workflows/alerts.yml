name: Send alert digests

# E-POSTA UYARILARI 2026-09'DA KALDIRILDI / email alerts removed in 2026-09.
# The schedule is gone and scripts/send-alerts.mjs stops at its first line
# ("email alerts are removed"): a hand-run reads nothing, sends nothing and
# marks nothing as sent. The file stays so the feature can come back — see
# docs/EMAIL_ALERTS.md for the steps, including how to keep the backlog of
# old alerts from going out in one burst.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Match and print without sending'
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # A repository without the service key has nobody to read alerts for.
      # That is a configuration state, not a failure, so the job says so and
      # stops rather than going red every morning.
      - name: Check configuration
        id: cfg
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not configured — skipping the digest."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Send digests
        if: steps.cfg.outputs.ready == 'true'
        run: node scripts/send-alerts.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
