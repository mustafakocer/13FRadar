name: Congress probe

# Temporary: shows the shape of the House Clerk and Senate eFD data in the
# log while the Congress parsers are written. Reads only; removed before merge.
on:
  push:
    branches: ['claude/practical-brahmagupta-ivlhmo']
    paths: ['scripts/probe-congress.mjs', '.github/workflows/congress-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save pdfjs-dist@4
      - run: node scripts/probe-congress.mjs
        env:
          SEC_USER_AGENT: 'Fundocap congress bot (https://www.fundocap.co)'
