name: Congress probe

# Temporary: runs the Congress build against the live sources into a scratch
# directory and uploads the result, while the feature is written. Writes
# nothing to the repo; removed before merge.
on:
  push:
    branches: ['claude/practical-brahmagupta-ivlhmo']
    paths: ['scripts/build-congress.mjs', 'api/_lib/congress*.js', '.github/workflows/congress-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: mkdir -p /tmp/congress && node scripts/build-congress.mjs 2>&1 | tee /tmp/congress/build.log
        env:
          CONGRESS_DATA_DIR: /tmp/congress
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: congress
          path: /tmp/congress
