name: Build consensus & returns

on:
  workflow_dispatch: {}
  schedule:
    # Daily 04:30 UTC — keeps the consensus page and return columns fresh
    - cron: '30 4 * * *'
  push:
    paths:
      - 'scripts/build-consensus.mjs'
      - 'api/_lib/consensusBuild.js'
      - 'api/_lib/sec.js'
      - 'scripts/build-guru-history.mjs'
      - 'scripts/build-splits.mjs'
      - 'scripts/build-related.mjs'
      - 'scripts/build-guru-activity.mjs'
      - '.github/workflows/consensus.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build consensus.json & returns.json
        run: node scripts/build-consensus.mjs
        env:
          SEC_USER_AGENT: '13FRadar bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Build guru-history.json (10 years, curated gurus) & splits.json
        run: node scripts/build-guru-history.mjs && node scripts/build-splits.mjs && node scripts/build-related.mjs
        env:
          SEC_USER_AGENT: '13FRadar bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      # pivots guru-history by quarter for /report, and fills in sector,
      # market cap and the ETF flag when an FMP key is configured
      - name: Build guru-activity.json
        run: node scripts/build-guru-activity.mjs
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name 'consensus-bot'
          git config user.email 'actions@github.com'
          git add --all client/public api/_data/consensus-pro.json api/_data/guru-history.json api/_data/splits.json api/_data/related.json api/_data/ticker-meta.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh consensus & returns data'
          # the branch may have moved during the long run — rebase our data
          # commit on top and retry the push a few times
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying…"; sleep 10
          done
          exit 1
