name: Build consensus & returns

on:
  # The knobs that decide how long a run takes. The guru bench went from 20
  # names to 99, and a first run that walks forty quarters for all of them can
  # outlast the job. Start shallow to get the data out, then re-run deeper:
  # the history cache keys on which filings were read, so raising the look-back
  # rebuilds rather than being mistaken for work already done.
  workflow_dispatch:
    inputs:
      guru_quarters:
        description: 'Quarters of history per guru (40 = full ten years)'
        type: string
        default: '40'
      sector_budget:
        description: 'New symbols to look a sector up for this run (SEC, ~10/s)'
        type: string
        default: '2500'
      allow_drift:
        description: 'Treat a large jump as expected (a real change, not a bad upstream day)'
        type: boolean
        default: false
  schedule:
    # Daily 04:30 UTC — keeps the consensus page and return columns fresh
    - cron: '30 4 * * *'
  push:
    # Only the deployment branch. A feature-branch push used to start a full
    # crawl on that branch: hours of CI, a data commit on a throwaway ref, and
    # — through the shared concurrency group — the real run on the deployment
    # branch left queued behind it.
    branches:
      - claude/13f-intelligence-features-nejb1h
    paths:
      - 'scripts/build-consensus.mjs'
      - 'scripts/build-stock-meta.mjs'
      - 'api/_lib/consensusBuild.js'
      - 'api/_lib/consensusList.js'
      - 'api/_lib/stockMetaBuild.js'
      - 'api/_lib/marketData.js'
      - 'api/_lib/figi.js'
      - 'api/_lib/sec.js'
      - 'scripts/build-guru-history.mjs'
      - 'scripts/build-splits.mjs'
      - 'scripts/build-related.mjs'
      - 'scripts/build-guru-activity.mjs'
      - 'scripts/build-filings.mjs'
      - 'api/_lib/filings.js'
      - '.github/workflows/consensus.yml'

permissions:
  contents: write

# One data run at a time on the deployment branch. The cron and a push on the
# same morning used to run side by side, each spending two hours to race the
# other to the same commit.
concurrency:
  group: consensus-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 88 minutes was the 20-guru run; 99 gurus and the filings crawl need room
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Sector comes from SEC (SIC code), market cap from SEC's share count
      # times Yahoo's chart price, returns from the same chart. FMP is only
      # asked, one symbol at a time within its free quota, for the caps SEC
      # cannot price (dual-class names, funds).
      - name: Build consensus.json, guru-stocks.json & returns.json
        run: node scripts/build-consensus.mjs
        env:
          SEC_USER_AGENT: 'Fundocap bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_BUDGET: '100'
          SECTOR_BUDGET: ${{ inputs.sector_budget || '2500' }}
      - name: Build guru-history.json (10 years, curated gurus) & splits.json
        run: node scripts/build-guru-history.mjs && node scripts/build-splits.mjs && node scripts/build-related.mjs
        env:
          SEC_USER_AGENT: 'Fundocap bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          GURU_HISTORY_QUARTERS: ${{ inputs.guru_quarters || '40' }}
      # pivots guru-history by quarter for /report; sector, market cap and
      # the ETF flag come from the sector map the step above just refreshed
      - name: Build guru-activity.json
        run: node scripts/build-guru-activity.mjs
      # The filing feed reads one small daily index per business day, so it is
      # cheap enough to refresh with the rest rather than on its own schedule.
      - name: Build filings.json
        run: node scripts/build-filings.mjs
        env:
          SEC_USER_AGENT: 'Fundocap bot (kocergpt@gmail.com)'
      # The gate. A rebuild that produced something implausible stops here,
      # with the previous data still live, instead of publishing a bad number
      # and waiting for somebody to notice.
      - name: Audit the rebuilt data
        run: node scripts/audit-data.mjs --only=consensus,consensus-pro,guru-stocks,guru-history,guru-activity,returns,splits,related,filings,filer-states,sector-map
        env:
          AUDIT_ALLOW_DRIFT: ${{ inputs.allow_drift == true && '1' || '0' }}

      - name: Commit if changed
        run: |
          git config user.name 'consensus-bot'
          git config user.email 'actions@github.com'
          # Stage only what this run actually produced. `git add` fails on a
          # pathspec that matches nothing, and some outputs are optional —
          # sector-map.json is written only when the sector lookup found
          # something. An hour of crawling should not be thrown away because
          # one optional file was not written.
          for f in client/public api/_data/consensus-pro.json api/_data/guru-stocks.json api/_data/guru-history.json api/_data/splits.json api/_data/related.json api/_data/ticker-meta.json api/_data/sector-map.json api/_data/filer-meta.json; do
            if [ -e "$f" ]; then git add --all "$f"; fi
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh consensus & returns data'
          # A rebase refuses to start on a dirty tree, and a build that writes
          # anything outside the paths above leaves one — an `npm install` that
          # rewrote the lockfile cost three days of data this way, with every
          # file built and none of it pushed. Name what is left over and set it
          # aside, so the run that did the work is the run that lands it.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::left uncommitted, set aside before the rebase:"
            git status --porcelain
            git stash push --include-untracked --quiet
          fi
          # the branch may have moved during the long run — rebase our data
          # commit on top and retry the push a few times
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying…"; sleep 10
          done
          exit 1
