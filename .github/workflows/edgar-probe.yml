name: EDGAR probe (temporary)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/jolly-ritchie-h9wlu2
    paths:
      - '.github/workflows/edgar-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Who still files 13F for these funds?
        run: |
          node --input-type=module -e "
          const UA = '13FRadar research (kocergpt@gmail.com)';
          const get = async (url) => {
            const r = await fetch(url, { headers: { 'User-Agent': UA } });
            return { status: r.status, body: await r.text() };
          };
          const CIKS = { '0001079114': 'Greenlight Capital', '0001649339': 'Scion Asset Management', '0001336528': 'Pershing Square', '0001067983': 'Berkshire (control)' };
          for (const [cik, label] of Object.entries(CIKS)) {
            const r = await get('https://data.sec.gov/submissions/CIK' + cik + '.json');
            if (r.status !== 200) { console.log(label, cik, '-> HTTP', r.status); continue; }
            const j = JSON.parse(r.body);
            const rec = j.filings?.recent || {};
            const rows = [];
            for (let i = 0; i < (rec.form || []).length; i++) {
              if (String(rec.form[i]).startsWith('13F')) rows.push(rec.form[i] + ' report=' + rec.reportDate[i] + ' filed=' + rec.filingDate[i]);
            }
            console.log('=== ' + label + ' (' + cik + ') name=' + j.name);
            console.log('    former:', JSON.stringify((j.formerNames || []).map(f => f.name)));
            console.log('    total recent filings:', (rec.form || []).length, '| newest overall:', rec.filingDate?.[0], rec.form?.[0]);
            console.log('    13F filings (newest 5):', rows.slice(0, 5).join(' | ') || 'NONE');
            console.log('    older file buckets:', JSON.stringify((j.filings?.files || []).map(f => f.name)));
            await new Promise(s => setTimeout(s, 300));
          }
          for (const q of ['greenlight', 'DME']) {
            const r = await get('https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company=' + q + '&type=13F-HR&dateb=&owner=include&count=40&output=atom');
            const names = [...r.body.matchAll(/<title>([^<]*)<\/title>/g)].map(m => m[1]);
            const ciks = [...r.body.matchAll(/CIK=(\d{10})/g)].map(m => m[1]);
            console.log('=== company search \"' + q + '\" HTTP ' + r.status);
            console.log('    titles:', JSON.stringify(names.slice(0, 12)));
            console.log('    ciks:', JSON.stringify([...new Set(ciks)].slice(0, 12)));
            await new Promise(s => setTimeout(s, 500));
          }
          "
