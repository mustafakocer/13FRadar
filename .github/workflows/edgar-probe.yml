name: Probe market data sources

# Reachability and shape check for the upstreams the site reads: EDGAR
# (submissions, XBRL frames, company_tickers, full-text search), OpenFIGI, and
# the live price chain the /api/stock handler races — FMP, TwelveData,
# Finnhub. Yahoo and Stooq are out of that chain for good and are not probed.
# Prints only; nothing is written or committed. The step summary carries one
# row per upstream. Red means every keyed price provider failed (the quote
# board would be on the snapshot) or the script itself broke; an EDGAR or
# FIGI hiccup is a row, not a failure. Run it by hand when a build starts
# coming back empty and the question is "which upstream changed?".
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/edgar-probe.yml'
      - 'scripts/probe-market-data.mjs'
      - 'api/_lib/providers.js'
      - 'api/_lib/providerHealth.js'
      - 'api/_handlers/stock.js'
      - 'api/_lib/marketData.js'
      - 'api/_lib/stockMetaBuild.js'
      - 'scripts/build-insiders.mjs'
      - 'scripts/build-guru-activity.mjs'
      - 'api/_lib/dataAudit.js'
      - 'api/_lib/consensusList.js'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/probe-market-data.mjs
        env:
          SEC_USER_AGENT: 'Fundocap probe (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      # Dry runs of the enrichment over the committed data: what the real
      # builds would write, audited, and thrown away. Nothing is committed.
      - name: Dry run — sector, market cap, returns
        run: node scripts/build-stock-meta.mjs
        env:
          SEC_USER_AGENT: 'Fundocap probe (kocergpt@gmail.com)'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_BUDGET: '20'
      - name: Dry run — guru activity
        run: node scripts/build-guru-activity.mjs
      - name: Dry run — insiders
        run: node scripts/build-insiders.mjs
        env:
          SEC_USER_AGENT: 'Fundocap probe (kocergpt@gmail.com)'
          INSIDER_MONTHS: '12'
          INSIDER_MAX_DAYS: '3'
      - name: Audit what the dry runs wrote
        run: node scripts/audit-data.mjs
        env:
          AUDIT_REPORT: '0'
      - name: What changed
        run: |
          git status --short
          node -e "
            const m = require('./api/_data/sector-map.json');
            const by = Object.values(m.bySymbol);
            const tally = {};
            for (const s of by) tally[s] = (tally[s] || 0) + 1;
            console.log('sector-map', Object.keys(m.bySymbol).length, 'symbols', tally, 'caps', Object.keys(m.caps || {}).length, 'etf', Object.keys(m.etf || {}).length);
            const g = require('./api/_data/guru-stocks.json');
            console.log('guru-stocks sample', g.stocks.slice(0, 5).map((s) => [s.ticker, s.sector, s.marketCap, s.cap]));
            const r = require('./client/public/returns.json');
            console.log('returns', Object.keys(r.returns).length, r.returns.AAPL, r.returns.SPY);
            const t = require('./api/_data/ticker-meta.json');
            const vals = Object.values(t);
            console.log('ticker-meta', vals.length, 'px', vals.filter((x) => x.px).length, 'sector', vals.filter((x) => x.sector).length, 'mcap', vals.filter((x) => x.mcap).length, t.AAPL);
          "
