name: Fundamentals (diagnose)

# Reads SEC's companyfacts for the site's stocks and prints what the nightly
# build would write — coverage over the top 500 by 13F value, the test
# tickers' EPS, P/E and market cap, and one JSON line per top-500 record.
# Commits nothing. On a pull request it runs only when the head commit's
# message carries [diag].
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'api/_lib/secFundamentals.js'
      - 'scripts/build-fundamentals.mjs'
      - 'config/share-classes.json'
      - '.github/workflows/fundamentals-diag.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: ask
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git log -1 --format=%B | grep -q '\[diag\]'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "no [diag] in the head commit: skipped"; fi
      - if: steps.ask.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.ask.outputs.run == 'true'
        run: npm ci
      - if: steps.ask.outputs.run == 'true'
        name: Download SEC companyfacts.zip
        run: |
          curl -sS --fail --retry 3 -A 'Fundocap fundamentals bot (kocergpt@gmail.com)' -o "$RUNNER_TEMP/companyfacts.zip" https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip
          ls -la "$RUNNER_TEMP/companyfacts.zip"
      - if: steps.ask.outputs.run == 'true'
        name: The test tickers
        run: node scripts/build-fundamentals.mjs
        env:
          SEC_USER_AGENT: 'Fundocap fundamentals bot (kocergpt@gmail.com)'
          COMPANYFACTS_ZIP: ${{ runner.temp }}/companyfacts.zip
          FUNDAMENTALS_TICKERS: 'AAPL,MSFT,BRK-B,BRK-A,TSM,SLBT,GOOGL,GOOG,META,NVDA,KO,JPM,BABA,TM,ASML,SONY,RIVN,INTC,PFE,XOM'
          FUNDAMENTALS_DRY: '1'
      - if: steps.ask.outputs.run == 'true'
        name: Every page's ticker, dry (coverage + top-500 seed lines)
        run: node scripts/build-fundamentals.mjs
        env:
          SEC_USER_AGENT: 'Fundocap fundamentals bot (kocergpt@gmail.com)'
          COMPANYFACTS_ZIP: ${{ runner.temp }}/companyfacts.zip
          FUNDAMENTALS_DRY: '1'
          FUNDAMENTALS_SEED: 'top500'
