name: Build insider trading data

on:
  workflow_dispatch:
    inputs:
      allow_drift:
        description: 'Treat a large jump as expected (a real change, not a bad upstream day)'
        type: boolean
        default: false
  schedule:
    # 04:53 UTC daily (07:53 Istanbul) — after the universe and consensus
    # chain, before the US pre-market. Form 4s are filed through the evening,
    # so this picks up the previous session. Sunday finds nothing new and
    # exits in seconds, but keeping it daily means a backlog is never a day
    # older than it has to be. An odd minute: GitHub queues :00 and :30 runs
    # for hours on busy mornings.
    - cron: '53 4 * * *'
  push:
    # Only the deployment branch. A feature-branch push used to start a full
    # crawl on that branch: hours of CI, a data commit on a throwaway ref, and
    # — through the shared concurrency group — the real run on the deployment
    # branch left queued behind it.
    branches:
      - main
    paths:
      - 'scripts/build-insiders.mjs'
      - 'api/_lib/insiderModel.js'
      - 'api/_lib/marketData.js'
      - '.github/workflows/insiders.yml'

permissions:
  contents: write

concurrency:
  group: insiders-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # the first run pulls a year of quarterly SEC datasets; later runs only
    # scan the days added since the last commit and take a few minutes
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build insiders.json
        run: node scripts/build-insiders.mjs
        env:
          SEC_USER_AGENT: 'Fundocap insider bot (kocergpt@gmail.com)'
          INSIDER_MONTHS: '12'
          # Only binds while the crawl is behind: a run that is current scans
          # the one new day. 45 days is ~3 hours at SEC's rate limit, well
          # inside the job timeout, and clears a months-long backlog in two
          # nights instead of four.
          INSIDER_MAX_DAYS: '45'
      - name: Report dataset freshness
        if: always()
        run: |
          node -e "
            const d = require('./api/_data/insiders.json');
            const days = Math.round((Date.now() - Date.parse(d.lastDay + 'T00:00:00Z')) / 86400000);
            console.log('last filing day ' + d.lastDay + ' (' + days + ' days old), ' + d.rows.length + ' rows');
            if (days > 5) { console.error('::warning::insider dataset is ' + days + ' days behind'); }
          "

      # The gate. A rebuild that produced something implausible stops here,
      # with the previous data still live, instead of publishing a bad number
      # and waiting for somebody to notice.
      - name: Audit the rebuilt data
        run: node scripts/audit-data.mjs --only=insiders,insiders-teaser
        env:
          AUDIT_ALLOW_DRIFT: ${{ inputs.allow_drift == true && '1' || '0' }}

      - name: Commit if changed
        run: |
          git config user.name 'insider-bot'
          git config user.email 'actions@github.com'
          # Stage only what this run actually produced. `git add` fails on a
          # pathspec that matches nothing, and some outputs are optional —
          # sector-map.json is written only when the sector lookup found
          # something. An hour of crawling should not be thrown away because
          # one optional file was not written.
          for f in api/_data/insiders.json api/_data/ticker-meta.json client/public/insiders-teaser.json client/public/data-audit.json; do
            if [ -e "$f" ]; then git add --all "$f"; fi
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh insider trading data'
          # A rebase refuses to start on a dirty tree, and a build that writes
          # anything outside the paths above leaves one — an `npm install` that
          # rewrote the lockfile cost three days of data this way, with every
          # file built and none of it pushed. Name what is left over and set it
          # aside, so the run that did the work is the run that lands it.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::left uncommitted, set aside before the rebase:"
            git status --porcelain
            git stash push --include-untracked --quiet
          fi
          # the branch may have moved during the long run — rebase and retry
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying…"; sleep 10
          done
          exit 1
