name: Lighthouse

# Performance, accessibility, best-practice and SEO scores on every
# finished Vercel preview (a PR's code) and once a day on production, for the pages a
# reader lands on (scripts/lighthouse-check.mjs). Accessibility below 90
# fails the check; performance is reported for a person to judge. No
# account or key: the open-source Lighthouse CLI on the runner's Chrome.
on:
  deployment_status: {}
  # Production is deployed by every nightly data commit (16–20 a day) with
  # the same code; measuring each one cost ~300 minutes a week. Code reaches
  # production through a PR whose preview was already measured, so once a
  # day is enough to catch a drift.
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to measure'
        type: string
        default: 'https://www.fundocap.co'

permissions:
  contents: read

jobs:
  lighthouse:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && !startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g lighthouse@12
      - name: Measure the deployment
        env:
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.url || 'https://www.fundocap.co' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -o pipefail
          echo "measuring $URL"
          node scripts/lighthouse-check.mjs "$URL" | tee lighthouse.md
          cat lighthouse.md >> "$GITHUB_STEP_SUMMARY"
