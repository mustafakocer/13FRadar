name: Stock logos

# Daily logo harvest (scripts/build-logos.mjs), LOGOS_BATCH tickers per run
# over every ticker with a known domain (client/public/domains.json): that
# site's apple-touch-icon / icon / og:image (≥ 64px, robots.txt obeyed),
# else the public favicon caches — cached in the repo so readers' browsers
# never call a company's site. The self-hosted fallback behind the logo CDN.
#
# It never overlaps the nightly data jobs: 08:41 UTC (the chain runs
# 01:23–05:30, insiders 03:31 and 11:02, domains 06:11) and, before
# fetching, it waits while any data workflow is still running — they share
# the Finnhub 50/min budget, and this job paces itself at 25/min.
on:
  schedule:
    - cron: '41 8 * * *' # daily 08:41 UTC
  # a change to the harvester itself runs once right after it lands — on
  # main, and on a work branch so the result can be checked before merging
  push:
    branches: [main]
    paths:
      - scripts/build-logos.mjs
      - api/_lib/logoScrape.js
      - .github/workflows/logos.yml
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refetch every logo, not just missing or stale ones'
        type: boolean
        default: false

concurrency:
  group: logos
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Wait for the data jobs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --json workflowName --jq '[.[] | select(.workflowName | test("consensus|universe|insider|FPI|Build"; "i"))] | length')
            if [ "${busy:-0}" = "0" ]; then echo "no data job running"; exit 0; fi
            echo "a data job is running ($busy) — waiting"; sleep 60
          done
          echo "::warning::data jobs still running after 40 minutes — skipping today"; exit 1
      - name: Top up company domains (the daily domains.yml carries the backlog)
        run: node scripts/build-domains.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          DOMAINS_BATCH: '200'
          SEC_USER_AGENT: 'Fundocap bot (kocergpt@gmail.com)'
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Fetch logos
        run: node scripts/build-logos.mjs ${{ inputs.refresh == true && '--refresh' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LOGOS_BATCH: '400'
      - name: Commit if changed
        run: |
          git config user.name 'logos-bot'
          git config user.email 'actions@github.com'
          git add --all client/public/logos client/public/logos.json client/public/domains.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh stock logos'
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 10))
          done
          echo "::error::could not push after 4 attempts"; exit 1
