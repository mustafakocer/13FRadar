name: Stock logos

# Weekly logo harvest for the top 500 stocks (scripts/build-logos.mjs):
# the company's own website from its Finnhub profile, then that site's
# apple-touch-icon / icon / og:image (≥ 64px, robots.txt obeyed), cached in
# the repo so readers' browsers never call a company's site. Below a 10%
# success rate the manifest ships empty and the badges stay.
#
# It never overlaps the nightly data jobs: Saturday mid-morning (the chain
# runs 01:23–05:30 UTC, insiders 03:31 and 11:02) and, before fetching, it
# waits while any data workflow is still running — they share the Finnhub
# 50/min budget, and this job paces itself at 25/min.
on:
  schedule:
    - cron: '41 7 * * 6' # Saturdays 07:41 UTC
  # a change to the harvester itself runs once right after it lands — on
  # main, and on a work branch so the result can be checked before merging
  push:
    branches: [main, 'claude/**']
    paths:
      - scripts/build-logos.mjs
      - scripts/build-domains.mjs
      - api/_lib/logoScrape.js
      - .github/workflows/logos.yml
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refetch every logo, not just missing or stale ones'
        type: boolean
        default: false

concurrency:
  group: logos
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Wait for the data jobs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --json workflowName --jq '[.[] | select(.workflowName | test("consensus|universe|insider|FPI|Build"; "i"))] | length')
            if [ "${busy:-0}" = "0" ]; then echo "no data job running"; exit 0; fi
            echo "a data job is running ($busy) — waiting"; sleep 60
          done
          echo "::warning::data jobs still running after 40 minutes — skipping this week"; exit 1
      - name: Resolve company domains (SEC, then Finnhub)
        run: node scripts/build-domains.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SEC_USER_AGENT: 'Fundocap bot (kocergpt@gmail.com)'
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Fetch logos
        run: node scripts/build-logos.mjs ${{ inputs.refresh == true && '--refresh' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name 'logos-bot'
          git config user.email 'actions@github.com'
          git add --all client/public/logos client/public/logos.json client/public/domains.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh stock logos'
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 10))
          done
          echo "::error::could not push after 4 attempts"; exit 1
