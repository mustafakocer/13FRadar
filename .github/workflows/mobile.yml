name: Mobile layout

# Renders the public pages at two phone widths (390×844, 360×800) against
# the built site served locally on fixtures, and fails when any page scrolls
# sideways (scripts/mobile-overflow.mjs). Screenshots are attached to the
# run (kept 3 days: they are only for looking at a failure), and the step
# summary lists every page × viewport with the widest element when one
# sticks out.
on:
  pull_request:
    paths:
      - 'client/**'
      - 'api/_lib/ssr/**'
      - 'scripts/mobile-overflow.mjs'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'api/_lib/ssr/**'
      - 'scripts/mobile-overflow.mjs'
      - '.github/workflows/mobile.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run build
        env:
          # a placeholder project, so the header renders its account button
          # as production does (the row's widest state); nothing signs in
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
      - name: Install Chromium for playwright-core
        run: npx playwright-core install --with-deps chromium
      - name: Serve the built site on fixtures
        run: |
          SEC_FIXTURE_DIR=$PWD/tests/fixtures/sec GURU_HISTORY_FILE=$PWD/api/_data/guru-history.json STOCK_UPSTREAM_MS=300 PORT=3001 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/tr && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3001/tr || { cat server.log; exit 1; }
      - name: Check every page at 390×844 and 360×800
        run: node scripts/mobile-overflow.mjs
        env:
          BASE: http://localhost:3001
          SHOTS: mobile-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: mobile-shots
          if-no-files-found: ignore
          retention-days: 3
        # the screenshots are a debugging aid: a full artifact quota must not
        # turn the layout check red
        continue-on-error: true

  # Screenshots uploaded before retention-days was set were kept 90 days and
  # filled the account's artifact quota (2026-10-19: the weekly database
  # backup could not upload). Delete the ones older than 3 days; on main only,
  # where the token may write.
  prune-screenshots:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete mobile screenshots older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # list first, then delete: deleting while paging shifts the pages
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"mobile-screenshots\" and .expired == false and .created_at < \"$cutoff\") | .id")
          echo "$(echo "$ids" | grep -c . || true) old screenshot artifacts"
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null && echo "deleted $id"
          done
