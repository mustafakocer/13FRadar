name: Newsletter and guru alerts

# Lead-magnet mail (scripts/send-newsletter.mjs): the weekly Smart Money
# newsletter on Mondays and single-guru 13F alerts every morning, to
# confirmed subscribers only (migrations/0007_subscribers). Commits nothing,
# so it costs no Vercel build. Runs after the nightly data jobs.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and print (addresses masked) without sending'
        type: boolean
        default: true
      force:
        description: 'Send the newsletter even if today is not Monday'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # A missing key used to stop the job green: every run from 2026-10-27
      # skipped the send without anyone seeing it. Now the run goes red and
      # names what is missing; a dry run needs no mail keys.
      - name: Check configuration
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SITE: ${{ secrets.SITE_URL }}
          MAIL_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.LEAD_FROM || secrets.ALERT_FROM }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          missing=""
          [ -n "$SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$SB_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SITE" ] || missing="$missing SITE_URL"
          if [ "$DRY" != "true" ]; then
            [ -n "$MAIL_KEY" ] || missing="$missing RESEND_API_KEY"
            [ -n "$MAIL_FROM" ] || missing="$missing LEAD_FROM (or ALERT_FROM)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not configured:$missing — nothing can be sent. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "configuration ok"
      - name: Send
        run: node scripts/send-newsletter.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM: ${{ secrets.LEAD_FROM || secrets.ALERT_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
