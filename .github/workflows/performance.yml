name: Build fund performance

on:
  workflow_dispatch: {}
  schedule:
    # Tuesdays 05:00 UTC — after the Monday universe build
    - cron: '0 5 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build performance.json
        run: node scripts/build-performance.mjs
        env:
          SEC_USER_AGENT: '13FRadar performance bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name 'performance-bot'
          git config user.email 'actions@github.com'
          git add client/public/performance.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh fund performance'
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying…"; sleep 10
          done
          exit 1
