name: Probe live API

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/probe.yml'

# probe-run: 13

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe stock endpoint
        run: |
          echo "=== /api/stock/AAPL ==="
          curl -sS -m 60 "https://13-f-radar-omega.vercel.app/api/stock/AAPL" | head -c 1500 || true
          echo
          echo "=== /api/chart/AAPL?range=1mo ==="
          curl -sS -m 60 "https://13-f-radar-omega.vercel.app/api/chart/AAPL?range=1mo" | head -c 400 || true
          echo
          echo "=== /api/returns?symbols=AAPL,MSFT ==="
          curl -sS -m 60 "https://13-f-radar-omega.vercel.app/api/returns?symbols=AAPL,MSFT" | head -c 400 || true
          echo
          echo "=== /universe.json (first bytes) ==="
          curl -sS -m 30 "https://13-f-radar-omega.vercel.app/universe.json" | head -c 300 || true
          echo
          echo "=== /stocks.json (first bytes) ==="
          curl -sS -m 30 "https://13-f-radar-omega.vercel.app/stocks.json" | head -c 300 || true
          echo
          echo "=== paywall check: /api/backtest/1067983 without token (expect 402 pro-required) ==="
          curl -sS -m 30 -w " [HTTP %{http_code}]" "https://13-f-radar-omega.vercel.app/api/backtest/1067983" | head -c 200 || true
          echo
          echo "=== free endpoint still open: /api/manager/1067983 ==="
          curl -sS -m 30 -w " [HTTP %{http_code}]" "https://13-f-radar-omega.vercel.app/api/manager/1067983" | head -c 120 || true
      - name: Data accuracy audit
        run: |
          B="https://13-f-radar-omega.vercel.app"
          echo "=== BRK latest holdings: internal consistency ==="
          ACC=$(curl -sS -m 30 "$B/api/manager/1067983" | jq -r '.filings[0].acc')
          echo "acc=$ACC"
          curl -sS -m 60 "$B/api/holdings/1067983/$ACC" -o /tmp/brk.json
          jq '{aum, count, weightSum: ([.positions[].weight] | add | .*100 | round / 100), valueSum: ([.positions[].value] | add), top3: [.positions[:3][] | {ticker, issuer, valueB: (.value/1e9 | .*100 | round/100), weight: (.weight | .*100 | round/100)}]}' /tmp/brk.json
          echo "=== cross-check BRK top position against raw SEC filing ==="
          CIK=1067983; A=$(echo $ACC | tr -d '-')
          XML=$(curl -sS -m 30 -H "User-Agent: audit kocergpt@gmail.com" "https://www.sec.gov/Archives/edgar/data/$CIK/$A/index.json" | jq -r '.directory.item[] | select(.name | test("\\.xml$")) | select(.name | test("primary") | not) | .name' | head -1)
          echo "infotable=$XML"
          curl -sS -m 60 -H "User-Agent: audit kocergpt@gmail.com" "https://www.sec.gov/Archives/edgar/data/$CIK/$A/$XML" -o /tmp/raw.xml
          echo "SEC raw: rows=$(grep -c '<infoTable>' /tmp/raw.xml || grep -oc 'infoTable>' /tmp/raw.xml)  totalValue=$(grep -o '<value>[0-9]*</value>' /tmp/raw.xml | grep -o '[0-9]*' | paste -sd+ | bc)"
          echo "=== cross-provider price agreement (AAPL) ==="
          FMP=$(curl -sS -m 40 "$B/api/stock/AAPL" | jq -r '.price.price')
          RET=$(curl -sS -m 40 "$B/api/returns?symbols=AAPL" | jq -r '.AAPL.price')
          echo "stock(FMP)=$FMP  returns(chain)=$RET"
          echo "=== static data freshness ==="
          curl -sS -m 20 "$B/consensus.json" | jq '{updatedAt, managers: (.managers|length), mostHeld: (.mostHeld|length)}'
          curl -sS -m 20 "$B/returns.json" | jq '{updatedAt, tickers: (.returns|length), AAPL: .returns.AAPL, SPY: .returns.SPY}' || echo "returns.json yok"
          curl -sS -m 20 "$B/universe.json" | jq '{updatedAt, count}'
      - name: Security & robustness audit
        run: |
          set +e
          B="https://13-f-radar-omega.vercel.app"
          ACC=$(curl -sS -m 30 "$B/api/manager/1067983" | jq -r '.filings[0].acc'); echo "ACC=$ACC"
          H() { curl -sS -m 40 -o /dev/null -D - "$@" | tr -d '\r' | grep -iE '^(HTTP|cache-control|x-vercel-cache|access-control|content-security|strict-transport|x-frame|x-content-type|content-encoding|content-length|content-type|referrer|permissions)' ; echo; }
          echo "=== [1] security headers: / ==="; H "$B/"
          echo "=== [1b] security headers: /api/manager/1067983 ==="; H "$B/api/manager/1067983"
          echo "=== [2] CORS with foreign Origin on API ==="; H -H "Origin: https://evil.example" "$B/api/holdings/1067983/$ACC" | grep -i access-control || echo "(no ACAO header)"
          echo "=== [3] /api/diag reachable? (info disclosure + 6 outbound fetches per hit) ==="
          curl -sS -m 40 -w " [HTTP %{http_code}, %{time_total}s]" "$B/api/diag" | head -c 300; echo
          echo "=== [4] webhook: GET, POST w/o secret, POST wrong secret ==="
          curl -sS -m 20 -w " [HTTP %{http_code}]" "$B/api/ls-webhook"; echo
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X POST -d '{}' "$B/api/ls-webhook"; echo
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X POST -d '{}' "$B/api/ls-webhook?secret=wrong"; echo
          echo "=== [5] malformed params ==="
          for p in "manager/abc" "manager/../../" "manager/%2e%2e%2f" "manager/00000000000000000000001067983" "holdings/1067983/foo" "holdings/1067983/..%2f..%2f" "chart/AAPL?range=foo" "stock/%3Cscript%3E" "stock/AAPL%27%20OR%201=1" "search?q=" "search?q=%3Cimg%20src=x%3E" "position-history/1067983/x" "returns?symbols=" "sectors?symbols=" "holders?q=" "backtest/abc" "nope" "manager" "manager/1067983/extra"; do
            printf '%-45s ' "$p"; curl -sS -m 40 -w " [HTTP %{http_code} %{time_total}s]" "$B/api/$p" | head -c 160; echo
          done
          echo "=== [6] method handling ==="
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X DELETE "$B/api/manager/1067983" | head -c 100; echo
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X POST -d 'x=1' "$B/api/search?q=berk" | head -c 100; echo
          echo "=== [7] paywall: 402 on every Pro route, with no token / garbage token / fake JWT ==="
          FAKE="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDAiLCJyb2xlIjoiYXV0aGVudGljYXRlZCIsImV4cCI6NDEwMjQ0NDgwMH0.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          for r in "backtest/1067983" "position-history/1067983/037833100" "stock-ownership?cusip=037833100"; do
            printf '%-40s none:' "$r"; curl -sS -m 40 -o /dev/null -w "%{http_code}" "$B/api/$r"
            printf '  garbage:'; curl -sS -m 40 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer garbage" "$B/api/$r"
            printf '  fakejwt:'; curl -sS -m 40 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $FAKE" "$B/api/$r"; echo
          done
          echo "=== [7b] cache headers on a 402 (must not be CDN-cached & served to Pro users) ==="; H "$B/api/backtest/1067983"
          echo "=== [7c] paywall bypass via other routes exposing the same data? holders (free) vs stock-ownership (pro) ==="
          curl -sS -m 40 -w " [HTTP %{http_code}]" "$B/api/holders?q=AAPL" | head -c 300; echo
          echo "=== [8] quota abuse: one request fanning out to many symbols ==="
          S=$(curl -sS -m 20 "$B/stocks.json" | jq -r '[.rows[:40][].ticker | select(. != null)] | join(",")' || echo "AAPL,MSFT")
          echo "symbols asked: $(echo $S | tr ',' '\n' | wc -l)"
          curl -sS -m 60 -w " [HTTP %{http_code} %{time_total}s]" "$B/api/returns?symbols=$S" | jq -c 'to_entries | {answered: length, nonNull: ([.[] | select(.value.price != null)] | length), sample: .[0]}' || echo "(non-json)"
          curl -sS -m 60 -w " [HTTP %{http_code} %{time_total}s]" "$B/api/sectors?symbols=$S" | head -c 200; echo
          echo "=== [9] cold/warm latency of heavy endpoints ==="
          for p in "manager/1067983" "holdings/1067983/$ACC" "aum-history/1067983" "manager-stats/1067983" "consensus" "search?q=bridgewater" "insiders/AAPL" "filings13dg/AAPL"; do
            printf '%-45s ' "$p"; for i in 1 2; do curl -sS -m 60 -o /dev/null -w "[HTTP %{http_code} %{time_total}s %{size_download}B] " "$B/api/$p"; done; echo
          done
          echo "=== [10] static assets: compression + size ==="
          for f in universe.json consensus.json stocks.json returns.json; do printf '%-18s ' "$f"; curl -sS -m 30 -o /dev/null -D - -H 'Accept-Encoding: br, gzip' "$B/$f" | tr -d '\r' | grep -iE '^(HTTP|content-encoding|content-length|cache-control|age)' | paste -sd' '; done
          echo "=== [11] SPA/SEO: unknown page status, robots, sitemap ==="
          curl -sS -m 20 -o /dev/null -w "/this-page-does-not-exist -> %{http_code}\n" "$B/this-page-does-not-exist"
          curl -sS -m 20 -o /dev/null -w "/robots.txt -> %{http_code}\n" "$B/robots.txt"
          curl -sS -m 20 -o /dev/null -w "/sitemap.xml -> %{http_code}\n" "$B/sitemap.xml"
          curl -sS -m 20 -o /dev/null -w "/api/index.js (source leak?) -> %{http_code}\n" "$B/api/index.js"
          curl -sS -m 20 -o /dev/null -w "/supabase/schema.sql -> %{http_code}\n" "$B/supabase/schema.sql"
          curl -sS -m 20 -o /dev/null -w "/.env -> %{http_code}\n" "$B/.env"
          echo "=== [12] error body leakage (upstream URL / stack) ==="
          curl -sS -m 40 "$B/api/holdings/1067983/0000000000-00-000000" | head -c 400; echo
          curl -sS -m 40 "$B/api/manager/999999999" | head -c 400; echo
      - name: Paywall & webhook verification (post-fix)
        run: |
          set +e
          B="https://13-f-radar-omega.vercel.app"
          ACC=$(curl -sS -m 30 "$B/api/manager/1067983" | jq -r '.filings[0].acc')
          echo "waiting for the new deployment (holdings response gains a 'locked' field)…"
          for i in $(seq 1 24); do
            if curl -sS -m 30 "$B/api/holdings/1067983/$ACC?light=1&v=$i" | jq -e 'has("locked")' >/dev/null 2>&1; then echo "deployed after $((i*10))s"; break; fi
            sleep 10
          done
          echo "=== [A] holdings, anonymous: expect 10 rows, locked=true, full count ==="
          curl -sS -m 40 "$B/api/holdings/1067983/$ACC?light=1&v=a" | jq -c '{rows: (.positions|length), count, locked, aum}'
          echo "=== [A2] holdings full=1 without token: still 10 rows, private cache ==="
          curl -sS -m 40 -D - -o /tmp/h.json "$B/api/holdings/1067983/$ACC?light=1&full=1" | tr -d '\r' | grep -iE '^(HTTP|cache-control|x-vercel-cache)'; jq -c '{rows: (.positions|length), locked}' /tmp/h.json
          echo "=== [A3] holdings cusips filter (free change detection) ==="
          curl -sS -m 40 "$B/api/holdings/1067983/$ACC?light=1&cusips=037833100,025816109" | jq -c '{rows: (.positions|length), cusips: [.positions[].cusip]}'
          echo "=== [A4] invalid accession → 400 fast ==="
          curl -sS -m 40 -w " [HTTP %{http_code} %{time_total}s]" "$B/api/holdings/1067983/foo"; echo
          echo "=== [B] newly gated routes → 402 ==="
          for r in "insiders/AAPL" "filings13dg/AAPL" "consensus"; do printf '%-22s ' "$r"; curl -sS -m 40 -w " [HTTP %{http_code}]" -D /tmp/hd "$B/api/$r" | head -c 80; echo " | $(grep -i cache-control /tmp/hd | tr -d '\r')"; done
          echo "=== [C] public consensus.json must not carry Pro lists ==="
          curl -sS -m 20 "$B/consensus.json" | jq -c '{keys: keys, mostHeld: (.mostHeld|length), topBought: (.topBought|length?), newPositions: (.newPositions|length?)}'
          echo "=== [D] webhook: unsigned POST → 401 (a 500 would mean the raw body could not be read) ==="
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X POST -H 'Content-Type: application/json' -d '{"meta":{"event_name":"subscription_created"}}' "$B/api/ls-webhook"; echo
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X POST -H 'Content-Type: application/json' -H 'X-Signature: deadbeef' -d '{"meta":{"event_name":"subscription_created"}}' "$B/api/ls-webhook"; echo
          curl -sS -m 20 -w " [HTTP %{http_code}]" -X POST -d '{}' "$B/api/ls-webhook?secret=anything"; echo
          echo "=== [E] free routes still public-cached ==="
          curl -sS -m 40 -D - -o /dev/null "$B/api/manager/1067983" | tr -d '\r' | grep -iE '^(HTTP|cache-control)'
