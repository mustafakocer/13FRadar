name: Build 13F universe

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC daily. The universe only really moves around quarterly
    # deadlines, so most runs commit nothing — but when a deadline passes the
    # file is current the next morning instead of the next Monday.
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build universe.json
        run: node scripts/build-universe.mjs
        env:
          SEC_USER_AGENT: '13FRadar universe bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name 'universe-bot'
          git config user.email 'actions@github.com'
          node scripts/build-slugs.mjs
          git add client/public/universe.json client/public/stocks.json api/_data/cusip-tickers.json api/_data/slugs.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh 13F universe data'
          # the branch may have moved during the multi-hour run — rebase and retry
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying…"; sleep 10
          done
          exit 1
