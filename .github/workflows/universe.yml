name: Build 13F universe

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Who started this run (cron = Supabase pg_cron; leave as manual)'
        type: string
        default: 'manual'
      allow_drift:
        description: 'Treat a large jump as expected (a real change, not a bad upstream day)'
        type: boolean
        default: false
  schedule:
    # Started on time by Supabase pg_cron (migrations/0005_job_triggers);
    # this entry is the fallback. Daily at 01:23 UTC (04:23 Istanbul), first in the nightly chain: the
    # consensus build runs when this finishes (workflow_run), the insider
    # build follows at 04:53. The repository is public, so Actions minutes
    # are free and a run that commits nothing costs nothing; weekly left the
    # universe eighteen days stale after one failed Monday. An odd minute
    # because GitHub queues the crowd at :00 and :30 for hours.
    - cron: '23 1 * * *'

permissions:
  contents: write
  issues: write # the 13F check's alarm issue (scripts/notify.mjs)

# the cron and its GitHub fallback queue instead of racing; the second one's
# guard then finds the day built and skips
concurrency:
  group: universe-data
  cancel-in-progress: false

jobs:
  # Does this run need to do the work? A cron / fallback / chained run skips
  # itself when another run already built in the same window; a person's run
  # and a push always build (scripts/run-guard.mjs, api/_lib/jobTriggers.js).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            api/_lib/jobTriggers.js
            scripts/run-guard.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: decide
        run: node scripts/run-guard.mjs
        env:
          WORKFLOW: universe.yml
          EVENT: ${{ github.event_name }}
          TRIGGER: ${{ inputs.trigger }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: guard
    # the guard failing (GitHub API down) must not cost a day of data
    if: ${{ !cancelled() && needs.guard.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build universe.json
        run: node scripts/build-universe.mjs
        env:
          SEC_USER_AGENT: 'Fundocap universe bot (kocergpt@gmail.com)'
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      # Stored values in dollars, filing by filing (a filer that wrote the
      # wrong unit is rescaled as a whole), the correction log rebuilt, and
      # the headline numbers recomputed from the result.
      - name: Check value units
        run: node scripts/repair-units.mjs
      # Our totals against the filers' declared ones (500 largest, ±5%) and
      # near-identical books. A finding the previous night did not have is
      # raised as an alarm after the data is committed; it never stops the
      # data, and nothing is added to config/misfiled-books.json.
      - name: Check totals against the filers' own and books filed twice
        id: audit13f
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-universe-audit.mjs 2>&1 | tee "$RUNNER_TEMP/universe-audit.log"
      # The gate. A rebuild that produced something implausible stops here,
      # with the previous data still live, instead of publishing a bad number
      # and waiting for somebody to notice.
      - name: Audit the rebuilt data
        run: node scripts/audit-data.mjs --only=universe,stocks,slugs,latest-holdings
        env:
          AUDIT_ALLOW_DRIFT: ${{ inputs.allow_drift == true && '1' || '0' }}

      - name: Commit if changed
        run: |
          git config user.name 'universe-bot'
          git config user.email 'actions@github.com'
          node scripts/build-slugs.mjs
          # Stage only what this run actually produced. `git add` fails on a
          # pathspec that matches nothing, and some outputs are optional —
          # sector-map.json is written only when the sector lookup found
          # something. An hour of crawling should not be thrown away because
          # one optional file was not written.
          for f in api/_data/unit-corrections.json client/public/universe.json client/public/universe-summary.json client/public/stocks.json api/_data/universe-audit.json api/_data/copy-books.json api/_data/cusip-tickers.json api/_data/security-master.json api/_data/latest-holdings.json api/_data/slugs.json client/src/data/guru-slugs.js client/public/data-audit.json; do
            if [ -e "$f" ]; then git add --all "$f"; fi
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'chore: refresh 13F universe data'
          # A rebase refuses to start on a dirty tree, and a build that writes
          # anything outside the paths above leaves one — an `npm install` that
          # rewrote the lockfile cost three days of data this way, with every
          # file built and none of it pushed. Name what is left over and set it
          # aside, so the run that did the work is the run that lands it.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::left uncommitted, set aside before the rebase:"
            git status --porcelain
            git stash push --include-untracked --quiet
          fi
          # the branch may have moved during the multi-hour run — rebase and retry
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying…"; sleep 10
          done
          exit 1

      # A new deviation or a new near-identical pair: the alarm issue, after
      # the data is committed. Raised again only for the next new finding.
      - name: Alert (13F check)
        if: ${{ !cancelled() && steps.audit13f.outcome == 'failure' }}
        run: >-
          node scripts/notify.mjs --title "13F denetimi: yeni toplam sapması ya da kopya portföy" --log "$RUNNER_TEMP/universe-audit.log"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_MENTION: ${{ vars.ALERT_MENTION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
